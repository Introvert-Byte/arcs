<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="50%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#5B8DEF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft background circle -->
  <circle cx="128" cy="128" r="118" fill="#0F172A"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#g)" stroke-width="6" opacity="0.9"/>
  <!-- Stylized arcs / layers -->
  <path d="M68 160 Q128 60 188 160" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M82 175 Q128 95 174 175" fill="none" stroke="url(#g2)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <path d="M96 188 Q128 125 160 188" fill="none" stroke="#A5B4FC" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <!-- Center accent -->
  <circle cx="128" cy="148" r="10" fill="#E0E7FF"/>
  <circle cx="128" cy="148" r="5" fill="#7C5CFC"/>
</svg>
