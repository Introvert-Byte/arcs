name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: arcs-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: arcs-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: arcs-macos-x86_64
          # Uncomment when you have Apple Silicon runners or cross-compile
          # - os: macos-14
          #   target: aarch64-apple-darwin
          #   artifact: arcs-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build release
        run: cargo build --release --locked
        # Use --target when cross-compiling; for native runners the host triple is fine

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          BIN=target/release/arcs
          cp "$BIN" "dist/${{ matrix.artifact }}"
          cp -r assets dist/ 2>/dev/null || true
          cp README.md dist/
          cd dist
          tar -czf "../${{ matrix.artifact }}.tar.gz" .
          cd ..
          ls -la ${{ matrix.artifact }}.tar.gz

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\arcs.exe dist\${{ matrix.artifact }}.exe
          if (Test-Path assets) { Copy-Item -Recurse assets dist\ }
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip
          Get-Item ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
