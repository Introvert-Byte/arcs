[package]
name = "arcs"
version = "0.5.4"
edition = "2021"
authors = ["Arcs Contributors"]
description = "Arcs Backup Studio — cross-platform backup and migration with native GUI"
license = "MIT"
repository = "https://github.com/introvert-byte/arcs"
readme = "README.md"
keywords = ["backup", "migration", "archive", "gui", "encryption", "egui"]
categories = ["command-line-utilities", "gui", "filesystem"]
include = [
    "src/**/*",
    "assets/**/*",
    "profiles/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[[bin]]
name = "arcs"
path = "src/main.rs"

[dependencies]
# CLI & argument parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Archive / compression
zip = { version = "0.6", default-features = false, features = ["deflate", "aes-crypto"] }
flate2 = "1.0"
tar = "0.4"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }

# Cross-platform paths & directories
directories = "5.0"
dirs = "5.0"
walkdir = "2.4"
which = "6.0"

# GUI (egui)
eframe = { version = "0.27", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.27"
rfd = "0.14"
image = { version = "0.24", default-features = false, features = ["png"] }

# TUI (still available via --tui)
ratatui = "0.26"
crossterm = "0.27"

# Async / HTTP (cloud)
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
bytes = "1.5"

# Progress & UI helpers
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"

# Logging & errors
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time & hashing
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.7", features = ["v4", "serde"] }

# Platform
cfg-if = "1.0"
os_info = "3.7"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "fileapi", "shellapi", "objbase", "combaseapi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
