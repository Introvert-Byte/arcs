name: daily-config
description: Backup important user configs
include:
  - ~/.config
  - ~/.local/share
exclude:
  - "**/.cache"
  - "**/Cache"
sources:
  - config
output: ~/Backups/arcs/daily-{timestamp}.arcs
encrypt: true
# password: set via env or prompt
dry_run: false
